[package]
name = "montessori-puzzles"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
resvg = "0.48.1"
rfd = "0.17.2"

[profile.dev.package."*"]
opt-level = 3
